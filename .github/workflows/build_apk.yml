name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Generate Android Code
        run: flutter create . --platforms=android --org=com.ui.music

      - name: Smart Manifest Injector (Crash-Proof)
        run: |
          python -c "
          # 1. SDK Version Update
          with open('android/app/build.gradle', 'r') as f: d = f.read()
          d = d.replace('flutter.minSdkVersion', '21').replace('flutter.compileSdkVersion', '34').replace('flutter.targetSdkVersion', '34')
          with open('android/app/build.gradle', 'w') as f: f.write(d)
          
          # 2. Safely Inject Background Permissions & Services
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f: m = f.read()
          
          permissions = '''<uses-permission android:name=\"android.permission.WAKE_LOCK\"/>
          <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>
          <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\"/>
          <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>
          <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\"/>
          <application'''
          
          services = '''
                  <service android:name=\"com.ryanheise.audioservice.AudioService\" android:foregroundServiceType=\"mediaPlayback\" android:exported=\"true\">
                      <intent-filter> <action android:name=\"android.media.browse.MediaBrowserService\" /> </intent-filter>
                  </service>
                  <receiver android:name=\"com.ryanheise.audioservice.MediaButtonReceiver\" android:exported=\"true\">
                      <intent-filter> <action android:name=\"android.intent.action.MEDIA_BUTTON\" /> </intent-filter>
                  </receiver>
              </application>'''
              
          m = m.replace('<application', permissions)
          m = m.replace('.MainActivity', 'com.ryanheise.audioservice.AudioServiceActivity')
          m = m.replace('</application>', services)
          
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f: f.write(m)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rehan-Apple-Style-Music-APK
          path: 'build/app/outputs/**/*.apk'
