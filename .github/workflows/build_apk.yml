name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Generate Android Code
        run: flutter create . --platforms=android --org=com.ui.music

      - name: Configure Clean SDK & Safe Permissions
        run: |
          python -c "
          import os
          # 1. Update Gradle SDK Versions
          with open('android/app/build.gradle', 'r') as f: d = f.read()
          d = d.replace('flutter.minSdkVersion', '21').replace('flutter.compileSdkVersion', '34').replace('flutter.targetSdkVersion', '34')
          with open('android/app/build.gradle', 'w') as f: f.write(d)
          
          # 2. Safely Update Manifest
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f: m = f.read()
          
          if 'WAKE_LOCK' not in m:
              m = m.replace('<application', '<uses-permission android:name=\"android.permission.WAKE_LOCK\"/>\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\"/>\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\"/>\n    <application')
          
          if 'AudioServiceActivity' not in m:
              m = m.replace('.MainActivity', 'com.ryanheise.audioservice.AudioServiceActivity')
          
          if 'AudioService' not in m:
              services = '''</activity>
                  <service android:name=\"com.ryanheise.audioservice.AudioService\" android:foregroundServiceType=\"mediaPlayback\" android:exported=\"true\">
                      <intent-filter> <action android:name=\"android.media.browse.MediaBrowserService\" /> </intent-filter>
                  </service>
                  <receiver android:name=\"com.ryanheise.audioservice.MediaButtonReceiver\" android:exported=\"true\">
                      <intent-filter> <action android:name=\"android.intent.action.MEDIA_BUTTON\" /> </intent-filter>
                  </receiver>'''
              m = m.replace('</activity>', services)
              
          with open(manifest_path, 'w') as f: f.write(m)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rehan-Premium-Light-APK
          path: 'build/app/outputs/**/*.apk'
